; Plantilla export_presets.cfg - Ajusta paths y keystore según tu proyecto
; Coloca en la raíz del proyecto como export_presets.cfg

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_path="build/windows/DashRunner.exe"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_with_debug=false
encryption_key=""

[preset.0.options]
windows/arch="x86_64"
windows/console_wrapper=true
windows/embed_pck=true
windows/shortcut_name="DashRunner"
windows/icon="res://icon.png"

[preset.1]

name="Android"
platform="Android"
runnable=false
dedicated_server=false
custom_features=""
export_path="build/android/DashRunner.apk"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_with_debug=false
encryption_key=""

[preset.1.options]
android/keystore_debug="user://DashRunner.keystore"
android/keystore_release="user://DashRunner.keystore"
android/keystore_alias="DashRunner"
android/keystore_password="CAMBIA_ESTA_PASSWORD"
android/key_password="CAMBIA_ESTA_PASSWORD"
android/export_mode="apk"
android/min_sdk=24
android/target_sdk=34
android/architectures=["arm64-v8a", "armeabi-v7a"]
android/icon="res://icon.png"
android/permissions=[]
android/features=[]

